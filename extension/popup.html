<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #080B0F; --surface: #11161E; --card: #1F2836;
      --border: #334258; --text: #E9EEF5; --muted: #98A5B6;
      --faint: #6B7787; --accent: #3E9C7A; --on-accent: #04120C; --warn: #D9A44F;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; width: 340px; background: var(--bg); color: var(--text);
      font: 12px/1.45 "Segoe UI Variable Text", "Segoe UI", sans-serif;
    }
    header {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px; background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
    .dot.on { background: var(--accent); }
    header b { font-size: 12px; letter-spacing: .04em; }
    #state { margin-left: auto; color: var(--muted); font-size: 11px; }
    .bar {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px; background: var(--card);
      border-bottom: 1px solid var(--border); font-size: 11px;
    }
    #host { color: var(--muted); font-weight: 600; }
    #host.ok { color: var(--accent); }
    #allownote { color: var(--faint); margin-left: auto; }
    #search {
      width: 100%; padding: 7px 9px; margin: 8px 0 4px;
      background: var(--card); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px; outline: none;
    }
    #search:focus { border-color: var(--accent); }
    main { padding: 0 12px 10px; max-height: 320px; overflow-y: auto; }
    .row {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 8px; border-radius: 6px; cursor: pointer;
    }
    .row:hover { background: var(--card); }
    .row.sug { background: rgba(62, 156, 122, .10); }
    .row.sug:hover { background: rgba(62, 156, 122, .18); }
    .section {
      color: var(--faint); font-size: 10px; text-transform: uppercase;
      letter-spacing: .06em; padding: 10px 8px 4px;
    }
    .row .assign { color: var(--warn); border-color: var(--border); }
    .row .assign:hover { border-color: var(--warn); color: var(--text); }
    .row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .kind { color: var(--faint); font-size: 10px; }
    .row .fill {
      border: 1px solid var(--border); background: transparent; color: var(--muted);
      border-radius: 5px; padding: 2px 6px; font-size: 10px; cursor: pointer;
    }
    .row .fill:hover { border-color: var(--accent); color: var(--text); }
    .options {
      display: flex; gap: 8px; align-items: center;
      padding: 6px 12px 0; color: var(--muted); font-size: 11px;
    }
    footer {
      padding: 8px 12px; border-top: 1px solid var(--border);
      background: var(--surface); color: var(--faint); font-size: 10px;
    }
    .empty { color: var(--muted); padding: 14px 4px; }
    .wide {
      display: block; width: 100%; margin: 10px 0 2px; padding: 7px 8px;
      background: transparent; color: var(--muted); cursor: pointer;
      border: 1px solid var(--border); border-radius: 6px; font-size: 11px;
    }
    .wide:hover { border-color: var(--accent); color: var(--text); }
  </style>
</head>
<body>
  <header>
    <span class="dot" id="dot"></span>
    <b>COFRE</b>
    <span id="state">comprobando...</span>
  </header>
  <div class="bar">
    <span id="host">sin pestana</span>
    <span id="allownote"></span>
  </div>
  <main>
    <input id="search" type="text" placeholder="buscar secreto" autocomplete="off">
    <div class="options">
      <label><input type="checkbox" id="focused"> Rellenar el campo enfocado</label>
    </div>
    <div id="list"></div>
    <button id="guardar_sitio" class="wide">Guardar este sitio en COFRE</button>
  </main>
  <footer id="foot">Solo funciona con el pendrive puesto y el cofre abierto. Ctrl+Shift+L abre este aviso.</footer>
  <script src="popup.js"></script>
</body>
</html>
